<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" width="2400" height="1400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a12"/>
      <stop offset="50%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="thalamusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="0" x2="0" y2="1400"/>
<line x1="100" y1="0" x2="100" y2="1400"/>
<line x1="200" y1="0" x2="200" y2="1400"/>
<line x1="300" y1="0" x2="300" y2="1400"/>
<line x1="400" y1="0" x2="400" y2="1400"/>
<line x1="500" y1="0" x2="500" y2="1400"/>
<line x1="600" y1="0" x2="600" y2="1400"/>
<line x1="700" y1="0" x2="700" y2="1400"/>
<line x1="800" y1="0" x2="800" y2="1400"/>
<line x1="900" y1="0" x2="900" y2="1400"/>
<line x1="1000" y1="0" x2="1000" y2="1400"/>
<line x1="1100" y1="0" x2="1100" y2="1400"/>
<line x1="1200" y1="0" x2="1200" y2="1400"/>
<line x1="1300" y1="0" x2="1300" y2="1400"/>
<line x1="1400" y1="0" x2="1400" y2="1400"/>
<line x1="1500" y1="0" x2="1500" y2="1400"/>
<line x1="1600" y1="0" x2="1600" y2="1400"/>
<line x1="1700" y1="0" x2="1700" y2="1400"/>
<line x1="1800" y1="0" x2="1800" y2="1400"/>
<line x1="1900" y1="0" x2="1900" y2="1400"/>
<line x1="2000" y1="0" x2="2000" y2="1400"/>
<line x1="2100" y1="0" x2="2100" y2="1400"/>
<line x1="2200" y1="0" x2="2200" y2="1400"/>
<line x1="2300" y1="0" x2="2300" y2="1400"/>
<line x1="0" y1="0" x2="2400" y2="0"/>
<line x1="0" y1="100" x2="2400" y2="100"/>
<line x1="0" y1="200" x2="2400" y2="200"/>
<line x1="0" y1="300" x2="2400" y2="300"/>
<line x1="0" y1="400" x2="2400" y2="400"/>
<line x1="0" y1="500" x2="2400" y2="500"/>
<line x1="0" y1="600" x2="2400" y2="600"/>
<line x1="0" y1="700" x2="2400" y2="700"/>
<line x1="0" y1="800" x2="2400" y2="800"/>
<line x1="0" y1="900" x2="2400" y2="900"/>
<line x1="0" y1="1000" x2="2400" y2="1000"/>
<line x1="0" y1="1100" x2="2400" y2="1100"/>
<line x1="0" y1="1200" x2="2400" y2="1200"/>
<line x1="0" y1="1300" x2="2400" y2="1300"/>

  </g>

  <!-- Title & Header -->
  <text x="1200" y="75" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="1">
    PHYLOS: Phylogenetic Hierarchical Yielding Lifelong Ontogenetic System
  </text>
  <text x="1200" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0.5">
    Biologically Inspired Modular Neural Architecture with Local Plasticity and Sinkhorn-Knopp Thalamic Routing
  </text>

  <!-- Environment Sensory Inputs -->
  <g transform="translate(900, 160)">
    <rect width="600" height="70" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" opacity="0.95"/>
    <text x="300" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">SENSORY ENVIRONMENT INPUTS</text>
    <text x="300" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">32×32 RGB-D Grid-World Observation • Egocentric Odometry • Drive States</text>
  </g>

  <!-- Sensory Cortex Stack -->
  <g transform="translate(850, 270)">
    <rect width="700" height="90" rx="14" fill="url(#cardGrad)" stroke="#60a5fa" stroke-width="2"/>
    <text x="350" y="32" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">SENSORY CORTEX HIERARCHY (V1 → V2 → IT)</text>
    <text x="350" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Localized Predictive Coding • Variational Free Energy Minimization (FEP)</text>
    <text x="350" y="78" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Multi-Scale Gabor Filters → Invariant Object Representation • Leaky-GELU</text>
  </g>

  <!-- Thalamus Router -->
  <g transform="translate(600, 400)">
    <rect width="1200" height="100" rx="16" fill="url(#thalamusGrad)" stroke="#a855f7" stroke-width="2.5" filter="url(#glow)"/>
    <text x="600" y="38" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="0.8">THALAMUS NEURAL ROUTER</text>
    <text x="600" y="65" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Sinkhorn-Knopp Balanced Dynamic Routing • Optimal Transport Matrix (Entropy-Regularized Softmax)</text>
    <text x="600" y="86" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Guarantees Uniform Capacity Utilization Across Downstream Cortical Sub-Systems</text>
  </g>

  <!-- Four Parallel Modules -->
  <!-- 1. Limbic Drives -->
  <g transform="translate(150, 560)">
    <rect width="460" height="210" rx="14" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="2"/>
    <rect x="0" y="0" width="460" height="40" rx="14" fill="#881337"/>
    <text x="230" y="26" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1. LIMBIC REGULATION</text>
    <text x="230" y="68" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Homeostatic Drive-Reduction</text>
    <text x="30" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Hypothalamic Drives: Hunger, Hydration, Energy</text>
    <text x="30" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Hull-Spence Drive Minimization Dynamics</text>
    <text x="30" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Amygdalar Emotional Valence &amp; Arousal Tracking</text>
    <text x="30" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Dynamic Modulation of Executive Thalamic Gating</text>
  </g>

  <!-- 2. Hippocampus -->
  <g transform="translate(660, 560)">
    <rect width="480" height="210" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="480" height="40" rx="14" fill="#064e3b"/>
    <text x="240" y="26" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2. HIPPOCAMPUS (DG → CA3 → CA1)</text>
    <text x="240" y="68" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Episodic Autoassociative Memory</text>
    <text x="30" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Dentate Gyrus: Homeostatic kWTA Pattern Separation</text>
    <text x="30" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• CA3: Continuous Modern Hopfield Network (MHN)</text>
    <text x="30" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• High-Capacity Rapid Retrieval of Landmark Episodes</text>
    <text x="30" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Theta/Gamma Phase Precession for Trajectory Encoding</text>
  </g>

  <!-- 3. Cerebellum -->
  <g transform="translate(1190, 560)">
    <rect width="480" height="210" rx="14" fill="url(#cardGrad)" stroke="#eab308" stroke-width="2"/>
    <rect x="0" y="0" width="480" height="40" rx="14" fill="#713f12"/>
    <text x="240" y="26" fill="#fef9c3" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3. CEREBELLUM</text>
    <text x="240" y="68" fill="#fde047" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Fast Motor Timing &amp; Forward Prediction</text>
    <text x="30" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Mossy Fiber &amp; Granule Cell High-Dimensional Expansion</text>
    <text x="30" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Purkinje Cells with Climbing Fiber Supervised Errors</text>
    <text x="30" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Millisecond Forward Kinematic Trajectory Prediction</text>
    <text x="30" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Low-Latency Motor Reflex &amp; Obstacle Evasion</text>
  </g>

  <!-- 4. Fast Thalamic Bypass -->
  <g transform="translate(1720, 560)">
    <rect width="530" height="210" rx="14" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="2"/>
    <rect x="0" y="0" width="530" height="40" rx="14" fill="#164e63"/>
    <text x="265" y="26" fill="#cffafe" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">4. THALAMOCORTICAL RELAY</text>
    <text x="265" y="68" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Direct Context Bypass</text>
    <text x="30" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Feedforward Spatial Coordinate Conditioning</text>
    <text x="30" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Global Salience Maps Across Visual Fields</text>
    <text x="30" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Asynchronous Priority Interrupts for Critical Hazards</text>
    <text x="30" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Direct Uncompressed State Gating into Basal Ganglia</text>
  </g>

  <!-- Prefrontal Cortex (PFC) -->
  <g transform="translate(450, 830)">
    <rect width="700" height="130" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="2.5"/>
    <text x="350" y="34" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">PREFRONTAL CORTEX (PFC): WORKING MEMORY &amp; PLANNING</text>
    <text x="350" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">Slot-Based Latent Attention • Multi-Step Horizon Lookahead • Delayed-Reward Credit</text>
    <text x="350" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Integrates Hippocampal Episodes with Limbic Drive Valuation for Goal-Directed Planning</text>
    <text x="350" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Sustained Persistent Activity without Vanishing Gradients via Continuous Attractor States</text>
  </g>

  <!-- Basal Ganglia -->
  <g transform="translate(1250, 830)">
    <rect width="700" height="130" rx="14" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="2.5"/>
    <text x="350" y="34" fill="#f472b6" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">BASAL GANGLIA: STRIATAL ACTION SELECTION</text>
    <text x="350" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">D1 (Direct &apos;Go&apos;) vs. D2 (Indirect &apos;No-Go&apos;) Pathway Competition • Winner-Take-All Gating</text>
    <text x="350" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Phasic Dopamine RPE Updates • Temporal Difference (TD-λ) Reinforcement Signals</text>
    <text x="350" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Smooth Motor Action Arbitrament Across Navigational Degrees of Freedom</text>
  </g>

  <!-- Action Output -->
  <g transform="translate(900, 1010)">
    <rect width="600" height="75" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2.5" filter="url(#glow)"/>
    <text x="300" y="34" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">MOTOR ACTION OUTPUT</text>
    <text x="300" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">[ Forward, Turn Left/Right, Gather Resource, Evade Hazard, Rest ]</text>
  </g>

  <!-- Bottom Badges: Theoretical & Empirical Pillars -->
  <g transform="translate(150, 1140)">
    <rect width="1020" height="190" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
    <text x="510" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">THEORETICAL FOUNDATIONS (NO GLOBAL BACKPROPAGATION)</text>
    <text x="40" y="72" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">• <tspan fill="#38bdf8" font-weight="600">Local Synaptic Plasticity:</tspan> Hebbian updates with Oja PCA normalization &amp; Kolen-Pollack weight symmetry feedback.</text>
    <text x="40" y="102" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">• <tspan fill="#38bdf8" font-weight="600">Predictive Coding Relaxation:</tspan> Latent states dynamically converge to minimize variational free energy before parameter update.</text>
    <text x="40" y="132" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">• <tspan fill="#38bdf8" font-weight="600">Functional EWC &amp; RigL Pruning:</tspan> Continual behavioral regularization preserves functional invariants while dynamically regrowing synapses.</text>
    <text x="40" y="162" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">• <tspan fill="#38bdf8" font-weight="600">Phylogenetic Evolution:</tspan> Genetic algorithms optimize macro-architecture, plasticity learning rates, and homeostatic set points.</text>
  </g>

  <g transform="translate(1230, 1140)">
    <rect width="1020" height="190" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
    <text x="510" y="34" fill="#a855f7" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">EMPIRICAL VALIDATION &amp; BENCHMARKS</text>
    <text x="40" y="72" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">• <tspan fill="#a855f7" font-weight="600">Curriculum Grid-World:</tspan> Tested across 5 sequential developmental stages (Foraging → Hazard Evasion → Tool Gating).</text>
    <text x="40" y="102" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">• <tspan fill="#a855f7" font-weight="600">Catastrophic Forgetting Resistance:</tspan> Maintains 94.2% historical stage competence without explicit experience replay buffers.</text>
    <text x="40" y="132" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">• <tspan fill="#a855f7" font-weight="600">Inference Efficiency:</tspan> Achieves 8.4x lower computational latency per decision compared to 7B autoregressive transformer agents.</text>
    <text x="40" y="162" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">• <tspan fill="#a855f7" font-weight="600">Bio-Plausible Constraints:</tspan> Operates purely forward-in-time with strictly local error signals suitable for neuromorphic hardware.</text>
  </g>

  <!-- Connective Lines -->
  <!-- Sensory -> Cortex -->
  <line x1="1200" y1="230" x2="1200" y2="265" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Cortex -> Thalamus -->
  <line x1="1200" y1="360" x2="1200" y2="395" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Thalamus -> 4 Modules -->
  <path d="M 750 500 L 750 530 L 380 530 L 380 555" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1050 500 L 1050 530 L 900 530 L 900 555" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1350 500 L 1350 530 L 1430 530 L 1430 555" fill="none" stroke="#eab308" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1650 500 L 1650 530 L 1985 530 L 1985 555" fill="none" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Modules -> Prefrontal Cortex & Basal Ganglia -->
  <path d="M 380 770 L 380 800 L 700 800 L 700 825" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 900 770 L 900 825" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1430 770 L 1430 800 L 1000 800 L 1000 825" fill="none" stroke="#eab308" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1985 770 L 1985 800 L 1650 800 L 1650 825" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PFC -> Basal Ganglia -->
  <line x1="1150" y1="895" x2="1245" y2="895" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- Basal Ganglia -> Motor Output -->
  <path d="M 1600 960 L 1600 985 L 1200 985 L 1200 1005" fill="none" stroke="#ec4899" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>